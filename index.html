<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Toms Playfab Tools</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="box" id="loginBox">
    <h2>Toms Playfab Tools</h2>
    <form id="loginForm">
      <input type="password" id="password" placeholder="Password" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" required>
      <br>
      <button type="submit">Login</button>
    </form>
    <p class="error" id="errorMessage"></p>
  </div>

  <div class="box success" id="successBox">
    <button type="button" id="backBtn" class="back-btn">← Back to Home Page</button>
    <h2>Toms Playfab Tools</h2>
    <div class="tool-grid">
      <div class="tool-tile">Ban All</div>
      <div class="tool-tile">Unban All</div>
      <div class="tool-tile">Ban Player</div>
      <div class="tool-tile">Unban Player</div>
      <div class="tool-tile">Lookup Player</div>
      <div class="tool-tile">Give All Cosmetics</div>
      <div class="tool-tile">Give Player Cosmetic</div>
      <div class="tool-tile">Get All User Data</div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
