<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Toms Playfab Tools</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="box" id="loginBox">
    <h2>Toms Playfab Tools</h2>
    <form id="loginForm">
      <input type="password" id="password" placeholder="Password" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" required>
      <br>
      <button type="submit">Login</button>
    </form>
    <p class="error" id="errorMessage"></p>
  </div>

  <div id="successMount"></div>

  <script src="script.js"></script>
</body>
</html>
